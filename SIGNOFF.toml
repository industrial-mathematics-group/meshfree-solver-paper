# AI declarations of the files in this repository (aisignoff, SIGNOFF.toml version 4).
# Levels: https://industrial-mathematics-group.github.io/aisignoff/levels/
# Converted from AIDECL.toml version 3 (aidecl) with aisignoff 1.0.0rc1 migrate and convert-to-version-4.py;
# the reported levels are unchanged. On the scale of version 4, a self-check by the generating session
# (A1 of version 3) is A0, and a review by a new session (A2 of version 3) is A1.
# The annotations are the file-level fallback: with [history], each line is declared by the commit that
# landed it on main (pull request descriptions, [[commits]] below), and [[attestations]] raise reviews.
# The last matching annotation wins. Human-Review levels are the ones Pascal declared on 3 Nov 2026.
version = 4
exclude = ["reviews/**"]   # committed AI reviews (CONTRIBUTING.md) need no declaration

[history]
enabled = true   # merge commits with "Pull request title and description" (SETUP.md)

# Default: README.md. The folder table was written by an AI session together with the
# supplementary archive; Pascal edited it and added the badges.
[[annotations]]
path = "**"
AI-Generation = "G2"
Human-Review = "H1"
AI-Review = "A0"
Assisted-by = ["Claude Opus 5.5 (Anthropic)"]
Reviewed-by = ["blhackslash <dev@blackslash.win>"]

# Supplementary material generated with Claude Fable 5.1 in Claude Code
# (AI statements in paper/main_light.tex, addendum/math_addendum.tex, stability/stability_combined.tex).
# The Opus 5.5 review of 3 Nov 2026 is not committed under reviews/ and the files were changed
# afterwards, so it does not count as an independent review (A1) here.
[[annotations]]
path = ["addendum/**", "fv_reference/**", "lean/**", "scripts/**", "stability/**", "paper/figures/epd_rules_light.tex", "jsc/figures/epd_rules_light.tex"]
AI-Generation = "G3"
Human-Review = "H0"
AI-Review = "A0"
Assisted-by = ["Claude Fable 5.1 (Anthropic)"]
Reviewed-by = ["blhackslash <dev@blackslash.win>"]

# Paper text, bibliography and build output: drafted in substantial parts with Claude Opus 5.5,
